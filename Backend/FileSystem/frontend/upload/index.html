<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Upload profile image</title>
  <link rel="stylesheet" href="/assets/auth.css">
  <script src="/assets/upload.js" defer></script>
</head>
<body>
  <main class="auth-card upload-card">
    <p class="eyebrow">PERSONALIZE YOUR ACCOUNT</p>
    <h1>Upload an image</h1>
    <p class="intro">Choose a JPG, PNG, WebP, or GIF image up to 5 MB. Your uploaded image will appear below.</p>
    <div class="upload-preview" data-upload-preview-container>
      <img data-upload-preview alt="Selected profile image preview" hidden>
      <span data-upload-placeholder>Image preview</span>
    </div>
    <form data-upload-form>
      <div class="field">
        <label for="avatar-file">Select image</label>
        <input id="avatar-file" name="avtar" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
      </div>
      <button class="button" type="submit">Upload image</button>
      <p class="form-status" data-upload-status role="status" aria-live="polite"></p>
    </form>
    <p class="form-footer"><a href="/me/">Back to profile</a></p>
  </main>
</body>
</html>
