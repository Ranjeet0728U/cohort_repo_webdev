<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Create account</title>
  <link rel="stylesheet" href="/assets/auth.css">
  <script src="/assets/auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <p class="intro">Enter your details to register. We’ll send you a link to verify your email.</p>
    <form data-auth-form="register">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" minlength="2" maxlength="50" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="role">Account type</label>
        <select id="role" name="role" required>
          <option value="customer">Customer</option>
          <option value="Seller">Seller</option>
          <option value="Delivery Patner">Delivery partner</option>
          <option value="manager">Manager</option>
        </select>
      </div>
      <button class="button" type="submit">Create account</button>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
    <p class="form-footer">Already registered? <a href="/login/">Log in</a></p>
  </main>
</body>
</html>
