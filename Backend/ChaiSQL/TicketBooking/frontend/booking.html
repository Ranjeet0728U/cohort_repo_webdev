
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stellar Seat Booking</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

      body {
        font-family: "Outfit", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
    </style>
  </head>

  <body
    class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"
  >
    <div
      class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50"
    >
      <!-- Header -->
      <div class="text-center mb-10">
        <h1
          class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight"
        >
          ChaiCode Cinema - Now Showing
          <br />
          <br />

          <span class="text-red-400">
            <span class="font-bold">Dhurandhar The Revenge</span>
          </span>
        </h1>

        <p class="text-slate-400 text-lg">
          Jassi ko ghar ki yaad kyu nhi aai?
        </p>
      </div>

      <!-- Legend -->
      <div class="flex justify-center mb-10">
        <div
          class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center"
        >
          <!-- Available -->
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"
            ></div>

            <span class="text-slate-300 font-medium tracking-wide">
              Available
            </span>
          </div>

          <div class="w-px h-6 bg-slate-700"></div>

          <!-- Booked -->
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"
            ></div>

            <span class="text-slate-400 font-medium tracking-wide">
              Booked
            </span>
          </div>
        </div>
      </div>

      <!-- Seats -->
      <div class="flex justify-center">
        <div
          class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner"
        >
          <table
            id="tbl"
            class="border-separate border-spacing-4 mx-auto"
          ></table>
        </div>
      </div>
    </div>

    <script>
      async function run() {
        const tbl = document.getElementById("tbl");

        try {
          // Get seats from backend
          const res = await fetch("/ticket/seats", {
            credentials: "include",
          });

          if (!res.ok) {
            throw new Error("Failed to fetch seats");
          }

          const resarray = await res.json();

          // Sort seats according to database ID
          const seats = resarray.sort((a, b) => a.id - b.id);

          let tr;

          for (let i = 0; i < seats.length; i++) {
            // Create new row after every 8 seats
            if (i % 8 === 0) {
              tr = document.createElement("tr");
              tbl.appendChild(tr);
            }

            const td = document.createElement("td");

            const baseClasses =
              "w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group";

            // IMPORTANT:
            // seatNumber is what backend expects.
            const seatNumber = seats[i].seatNumber;

            /*
             * =========================
             * BOOKED SEAT
             * =========================
             */
            if (seats[i].isBooked) {
              td.className =
                `${baseClasses} ` +
                `bg-rose-500/10 text-rose-500/60 ` +
                `border border-rose-500/20 cursor-not-allowed`;

              td.innerHTML = `
                <span class="relative z-10">
                  ${seatNumber}
                </span>

                <div
                  class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3
                  px-4 py-2 bg-slate-900 border border-slate-700
                  text-sm text-slate-300 rounded-xl
                  opacity-0 invisible
                  group-hover:opacity-100 group-hover:visible
                  transition-all duration-200 whitespace-nowrap
                  shadow-2xl z-50 pointer-events-none font-normal"
                >
                  Booked by:
                  <span class="font-bold text-white ml-1">
                    ${seats[i].name || "Unknown"}
                  </span>

                  <div
                    class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px]
                    border-[6px] border-transparent border-t-slate-700"
                  ></div>

                  <div
                    class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px]
                    border-[5px] border-transparent border-t-slate-900"
                  ></div>
                </div>
              `;
            }

            /*
             * =========================
             * AVAILABLE SEAT
             * =========================
             */
            else {
              td.className =
                `${baseClasses} ` +
                `bg-emerald-500 text-white ` +
                `border-2 border-emerald-400 ` +
                `shadow-[0_0_20px_rgba(16,185,129,0.3)] ` +
                `cursor-pointer hover:bg-emerald-400 ` +
                `hover:-translate-y-1.5 ` +
                `hover:shadow-[0_10px_25px_rgba(16,185,129,0.5)] ` +
                `active:scale-95 ` +
                `active:shadow-[0_0_10px_rgba(16,185,129,0.3)]`;

              td.innerHTML = `
                <span class="relative z-10">
                  ${seatNumber}
                </span>
              `;
            }

            /*
             * =========================
             * BOOKING CLICK
             * =========================
             */
            td.addEventListener("click", async function (e) {
              const currentTd = e.currentTarget;

              // Already booked
              if (
                currentTd.classList.contains("cursor-not-allowed")
              ) {
                return;
              }

              try {
                const name = prompt("Enter your name");

                if (!name || !name.trim()) {
                  return;
                }

                /*
                 * Send seatNumber to backend.
                 *
                 * Backend expects:
                 * {
                 *   name,
                 *   seatNumber
                 * }
                 */
                const bookingResponse = await fetch(
                  "/ticket/book",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type": "application/json",
                    },

                    credentials: "include",

                    body: JSON.stringify({
                      name: name.trim(),
                      seatNumber: seatNumber,
                    }),
                  }
                );

                const data = await bookingResponse.json();

                /*
                 * Booking failed
                 */
                if (!bookingResponse.ok || !data.success) {
                  alert(
                    data.message ||
                      "FAILED! Couldn't book the seat. It may already be booked."
                  );

                  return;
                }

                /*
                 * Booking successful
                 */
                alert("Booked successfully!");

                /*
                 * Change UI from available → booked
                 */
                currentTd.className =
                  `${baseClasses} ` +
                  `bg-rose-500/10 text-rose-500/60 ` +
                  `border border-rose-500/20 cursor-not-allowed`;

                currentTd.innerHTML = `
                  <span class="relative z-10">
                    ${seatNumber}
                  </span>

                  <div
                    class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3
                    px-4 py-2 bg-slate-900 border border-slate-700
                    text-sm text-slate-300 rounded-xl
                    opacity-0 invisible
                    group-hover:opacity-100 group-hover:visible
                    transition-all duration-200 whitespace-nowrap
                    shadow-2xl z-50 pointer-events-none font-normal"
                  >
                    Booked by:
                    <span class="font-bold text-white ml-1">
                      ${name.trim()}
                    </span>

                    <div
                      class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px]
                      border-[6px] border-transparent border-t-slate-700"
                    ></div>

                    <div
                      class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px]
                      border-[5px] border-transparent border-t-slate-900"
                    ></div>
                  </div>
                `;
              } catch (error) {
                console.error("Booking error:", error);

                alert(
                  "Error booking seat: " + error.message
                );
              }
            });

            tr.appendChild(td);
          }
        } catch (error) {
          console.error("Error loading seats:", error);

          alert(
            "Unable to load seats. Please login and try again."
          );
        }
      }

      // Load seats when page opens
      run();
    </script>
  </body>
</html>
